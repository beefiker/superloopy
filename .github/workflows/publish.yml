name: Publish to npm

# Publishes `superloopy` when a `v<version>` tag is pushed, and only then: there is no manual
# trigger, the tag must match package.json, and the tagged commit must already be on main, so a
# tag on an unmerged branch cannot publish unreleased code. Uses npm trusted publishing (OIDC):
# no npm token or 2FA secret is stored anywhere, and npm attaches a provenance attestation.
# Configure it once on npmjs.com: package `superloopy` -> Settings -> Trusted publishing ->
# GitHub Actions, repository `beefiker/superloopy`, workflow `publish.yml`. Do not also run
# `npm publish` by hand for the same version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      # HEAD, not GITHUB_SHA: after checkout it is the tagged commit for lightweight and annotated tags alike.
      - name: Check the tagged commit is on main
        run: |
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at ${commit}, which is not on main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public
