name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # Quoted globs, expanded by Node itself. A bare shell glob does not expand
      # in cmd.exe on Windows; a directory argument is imported as a module on
      # Node >= 22 rather than scanned; and bare `node --test` walks every
      # directory, including gitignored ones such as local worktrees.
      - name: Run tests
        run: node --test "test/**/*.test.js" "test/**/*.test.mjs" "examples/**/*.test.js" "examples/**/*.test.mjs"

  # Shipped files (package.json `files`) changed since the newest v* tag need a version above it.
  # Bump with `npm run release:bump -- <patch|minor|major>`.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check the version moved past the last release
        run: node scripts/version-guard.mjs --ref HEAD
